version: '3.8'

services:
  # Midnight Proof Server (Official Testnet)
  midnight-proof-server:
    image: ghcr.io/midnight-ntwrk/midnight-proof-server:latest
    container_name: hydrajts-proof-server
    ports:
      - "6300:6300"
      - "6301:6301"  # Metrics port
    environment:
      - RUST_LOG=info
      - PROOF_SERVER_PORT=6300
      - METRICS_PORT=6301
      - MAX_CONCURRENT_PROOFS=10
      - PROOF_TIMEOUT_MS=30000
      - ENABLE_METRICS=true
      - NETWORK=testnet
    volumes:
      - ./proof-artifacts:/proof-artifacts
      - ./circuits:/circuits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6300/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hydrajts-network

  # Redis for distributed queue (optional)
  redis:
    image: redis:alpine
    container_name: hydrajts-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hydrajts-network

  # # Optional: Proof Server UI (uncomment when UI is available)
  # proof-server-ui:
  #   image: nginx:alpine
  #   container_name: hydrajts-proof-ui
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./proof-ui:/usr/share/nginx/html
  #   depends_on:
  #     - midnight-proof-server
  #   networks:
  #     - hydrajts-network

volumes:
  redis-data:
  proof-artifacts:

networks:
  hydrajts-network:
    driver: bridge
